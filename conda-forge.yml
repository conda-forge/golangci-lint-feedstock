bot:
  automerge: true
conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
# conda-smithy only defaults provider for linux_64/osx_64/win_64; a native
# target with a null provider is dropped from CI altogether.
provider:
  linux_64: default
  linux_aarch64: default
  osx_64: default
  osx_arm64: default
  win_64: default
test: native_and_emulated
