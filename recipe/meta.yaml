{% set name = "golangci-lint" %}
{% set version = "2.13.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/golangci/golangci-lint/archive/v{{ version }}.tar.gz
  sha256: a79a7a1faad9c1538e3f7f8b32843a53bbeedfa9ead45d9e8ca3bb210d55ece0

build:
  number: 1

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  commands:
    - {{ name }} --help
    # Without -X main.date the linker-injected version is replaced by
    # debug.ReadBuildInfo().Main.Version, i.e. "(devel)".
    - test "$({{ name }} version --short)" = "{{ version }}"  # [unix]
    - {{ name }} version --short | findstr /C:"{{ version }}"  # [win]

about:
  home: https://golangci-lint.run
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - license-files/
  summary: Stricter gofmt
  dev_url: https://github.com/golangci/{{ name }}.git

extra:
  recipe-maintainers:
    - danielnachun
    - trim21
