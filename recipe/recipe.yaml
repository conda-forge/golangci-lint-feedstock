context:
  version: "2.13.2"

package:
  name: golangci-lint
  version: ${{ version }}

source:
  url: https://github.com/golangci/golangci-lint/archive/v${{ version }}.tar.gz
  sha256: a79a7a1faad9c1538e3f7f8b32843a53bbeedfa9ead45d9e8ca3bb210d55ece0

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - golangci-lint --help
      # Without -X main.date the linker-injected version is replaced by
      # debug.ReadBuildInfo().Main.Version, i.e. "(devel)".
      - if: unix
        then: test "$(golangci-lint version --short)" = "${{ version }}"
      - if: win
        then: golangci-lint version --short | findstr /X /C:"${{ version }}"

about:
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - license-files/
  summary: Stricter gofmt
  homepage: https://golangci-lint.run
  repository: https://github.com/golangci/golangci-lint

extra:
  recipe-maintainers:
    - danielnachun
