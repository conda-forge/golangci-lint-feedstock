context:
  version: "2.15.0"

package:
  name: golangci-lint
  version: ${{ version }}

source:
  url: https://github.com/golangci/golangci-lint/archive/v${{ version }}.tar.gz
  sha256: 5411598703f014f1128b209f3d46da6f9f2c99a68783c90f846b4db1c8c08742

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - golangci-lint --help
      # Without -X main.date the linker-injected version is replaced by
      # debug.ReadBuildInfo().Main.Version, i.e. "(devel)".
      - if: unix
        then: test "$(golangci-lint version --short)" = "${{ version }}"
      - if: win
        then: golangci-lint version --short | findstr /C:"${{ version }}"

about:
  license: GPL-3.0-only
  license_file:
    - LICENSE
    - license-files/
  summary: Stricter gofmt
  homepage: https://golangci-lint.run
  repository: https://github.com/golangci/golangci-lint

extra:
  recipe-maintainers:
    - danielnachun
    - trim21
